name: Docker image CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '14.22/**'
      - '15.17/**'
      - '16.13/**'
      - '17.8/**'
      - '18.2/**'
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:

jobs:
  build-docker-images:
    runs-on: [ubuntu-24.04]

    strategy:
      fail-fast: false
      matrix:
        version: [14.22-trixie, 15.17-trixie, 16.13-trixie, 17.8-trixie, 18.2-trixie]
        include:
          - version: 14.22-trixie
            docker-context: 14.22/debian/default
            docker-tags: |
              nicoherbigde/postgresql:14.22
              nicoherbigde/postgresql:14.22-trixie
          - version: 15.17-trixie
            docker-context: 15.17/debian/default
            docker-tags: |
              nicoherbigde/postgresql:15.17
              nicoherbigde/postgresql:15.17-trixie
          - version: 16.13-trixie
            docker-context: 16.13/debian/default
            docker-tags: |
              nicoherbigde/postgresql:16.13
              nicoherbigde/postgresql:16.13-trixie
          - version: 17.8-trixie
            docker-context: 17.8/debian/default
            docker-tags: |
              nicoherbigde/postgresql:17.8
              nicoherbigde/postgresql:17.8-trixie
          - version: 18.2-trixie
            docker-context: 18.2/debian/default
            docker-tags: |
              nicoherbigde/postgresql:18.2
              nicoherbigde/postgresql:18.2-trixie

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and Push it to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.docker-context }}
          no-cache: true
          pull: true
          push: true
          tags: ${{ matrix.docker-tags }}
