name: Docker image CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '14.24/**'
      - '15.19/**'
      - '16.15/**'
      - '17.11/**'
      - '18.6/**'
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:

jobs:
  build-docker-images:
    runs-on: [ubuntu-24.04]

    strategy:
      fail-fast: false
      matrix:
        version: [14.24-trixie, 15.19-trixie, 16.15-trixie, 17.11-trixie, 18.6-trixie]
        include:
          - version: 14.24-trixie
            docker-context: 14.24/debian/default
            docker-tags: |
              nicoherbigde/postgresql:14.24
              nicoherbigde/postgresql:14.24-trixie
          - version: 15.19-trixie
            docker-context: 15.19/debian/default
            docker-tags: |
              nicoherbigde/postgresql:15.19
              nicoherbigde/postgresql:15.19-trixie
          - version: 16.15-trixie
            docker-context: 16.15/debian/default
            docker-tags: |
              nicoherbigde/postgresql:16.15
              nicoherbigde/postgresql:16.15-trixie
          - version: 17.11-trixie
            docker-context: 17.11/debian/default
            docker-tags: |
              nicoherbigde/postgresql:17.11
              nicoherbigde/postgresql:17.11-trixie
          - version: 18.6-trixie
            docker-context: 18.6/debian/default
            docker-tags: |
              nicoherbigde/postgresql:18.6
              nicoherbigde/postgresql:18.6-trixie

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and Push it to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.docker-context }}
          no-cache: true
          pull: true
          push: true
          tags: ${{ matrix.docker-tags }}
